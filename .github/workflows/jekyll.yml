name: Deploy static site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Prepare static site artifact
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          cp index.html _site/
          cp privacy.html _site/
          cp terms.html _site/
          cp styles.css _site/
          cp script.js _site/
          cp favicon.png _site/
          cp appIcon.png _site/
          cp CNAME _site/
          cp robots.txt _site/
          cp sitemap.xml _site/
          cp -R assets _site/
          cp -R images _site/
          find _site -name .DS_Store -delete

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
